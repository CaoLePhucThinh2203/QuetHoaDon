active_dataset: "mc_ocr_2021"

mc_ocr_2021:
  name: "MC-OCR 2021"
  language: "vi"
  status: "primary"
  kaggle_slug: "domixi1989/vietnamese-receipts-mc-ocr-2021"
  raw_dir: "data/raw/mc-ocr-2021"
  raw_train_csv: "mcocr_train_df.csv"
  raw_val_sample_csv: "mcocr_val_sample_df.csv"
  train_image_subfolder: "train_images/train_images"
  val_image_subfolder: "val_images/val_images"
  annotation_usage: "audit_and_final_evaluation_only"

sroie:
  name: "SROIE 2019"
  language: "en"
  status: "planned"
  raw_dir: "data/raw/sroie"

cord:
  name: "CORD"
  language: "id"
  status: "planned"
  raw_dir: "data/raw/cord"

extraction_fields:
  required: ["SELLER", "ADDRESS", "ITEM_NAME", "ITEM_PRICE", "TOTAL_COST"]
  optional: ["QUANTITY", "TIMESTAMP"]

unsupervised:
  use_ground_truth_labels: false
  feature_sources:
    - "layoutxlm_hidden_states"
    - "normalized_bbox"
    - "text_shape"
    - "numeric_and_currency_patterns"
    - "row_column_alignment"
  clustering:
    algorithm: "hdbscan"
    enabled: true
    min_cluster_size: 3
  candidate_assignment:
    use_spatial_context: true
    use_lexical_patterns: true
    use_arithmetic_validation: true
    preserve_ambiguous_candidates: true
