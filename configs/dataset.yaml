active_dataset: "mc_ocr_2021"

mc_ocr_2021:
  name: "MC-OCR 2021"
  language: "vi"
  kaggle_slug: "domixi1989/vietnamese-receipts-mc-ocr-2021"
  raw_train_csv: "mcocr_train_df.csv"
  raw_val_sample_csv: "mcocr_val_sample_df.csv"
  train_image_subfolder: "train_images/train_images"
  val_image_subfolder: "val_images/val_images"
  # MC-OCR annotates ONLY these four fields (annotation category ids 15-18).
  # ITEM_NAME / ITEM_PRICE / QUANTITY have no ground truth in this dataset.
  annotated_fields: ["SELLER", "ADDRESS", "TIMESTAMP", "TOTAL_COST"]
  split:
    method: "invoice_level_random"     # src/preprocessing/dataset_preparer.py
    train_ratio: 0.8
    validation_ratio: 0.1
    test_ratio: 0.1
    seed: 42

# Output schema of the system (see src/extraction/schema.py).
extraction_fields:
  evaluable_on_mc_ocr: ["SELLER", "ADDRESS", "TIMESTAMP", "TOTAL_COST"]
  qualitative_only: ["ITEM_NAME", "ITEM_PRICE", "QUANTITY"]

# Not integrated. Keep only if/when files are actually downloaded and inspected.
planned_datasets:
  sroie: {name: "SROIE 2019", language: "en"}
  cord: {name: "CORD", language: "id"}
