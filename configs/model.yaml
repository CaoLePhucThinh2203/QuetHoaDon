# Pretrained inference components; no receipt-specific supervised fine-tuning.

detection:
  model_name: "CRAFT"
  pretrained: true
  inference_only: true
  text_threshold: 0.7
  link_threshold: 0.4
  low_text: 0.4
  polygon_output: true
  device: "cuda"

recognition:
  model_name: "VietOCR"
  pretrained: true
  inference_only: true
  backbone: "vgg_transformer"
  device: "cuda"
  img_height: 32
  img_width_min: 32
  img_width_max: 512

layout_encoder:
  model_name: "microsoft/layoutxlm-base"
  pretrained: true
  use_as: "feature_extractor"
  task_specific_classifier: false
  max_seq_length: 512
  coordinate_scale: 1000
  device: "cuda"

unsupervised_extraction:
  embedding_method: "layoutxlm_hidden_states"
  clustering_algorithm: "hdbscan"
  min_cluster_size: 3
  use_geometry: true
  use_text_patterns: true
  use_row_alignment: true
  validate_item_price_association: true
  validate_total_with_arithmetic: true
  return_uncertain_candidates: true
