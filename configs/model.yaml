# Pretrained components, inference only (baseline). Read by src/common/config.py.

preprocessing:
  target_max_dim: 1280      # longest side after resize
  enhance: true             # CLAHE + bilateral filter; set false if OCR quality drops
  min_skew: 0.5             # degrees; smaller angles are ignored
  max_skew: 15.0

detection:
  model_name: "CRAFT"
  device: "cuda"
  text_threshold: 0.7
  link_threshold: 0.4
  low_text: 0.4
  long_size: 1280           # keep equal to preprocessing.target_max_dim
  nested_threshold: 0.8     # drop boxes >= 80% inside a larger box (comma/dot boxes)

recognition:
  model_name: "VietOCR"
  backbone: "vgg_transformer"
  beamsearch: false
  device: "cuda"
  batch_size: 32

layout_encoder:
  model_name: "microsoft/layoutxlm-base"
  use_as: "feature_extractor"     # the OCR run only needs this off; fine-tuning uses LayoutLMv2ForTokenClassification
  max_seq_length: 512
  coordinate_scale: 1000
  save_fp16: true
  device: "cuda"
