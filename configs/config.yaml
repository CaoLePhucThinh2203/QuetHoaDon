project_name: "unsupervised-receipt-understanding"
version: "0.2.0"
environment: "kaggle"
seed: 42

paths:
  kaggle_input_dir: "/kaggle/input/vietnamese-receipts-mc-ocr-2021"
  local_data_dir: "data/raw"
  output_dir: "/kaggle/working/outputs"
  cache_dir: "/kaggle/working/cache"

data_policy:
  use_receipt_entity_labels_for_training: false
  annotations_allowed_for: ["dataset_audit", "final_evaluation"]
  inference_reads_annotations: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
