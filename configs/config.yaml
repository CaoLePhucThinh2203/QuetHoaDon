project_name: "quethoadon"
version: "0.3.0"
seed: 42

# Pick the block that matches where you run. `output_dir` receives OCR JSON, features, failed.json.
paths:
  colab:
    dataset_dir: "auto"                # resolved by kagglehub.dataset_download(...)
    output_dir: "./pipeline_results"
  kaggle:
    dataset_dir: "/kaggle/input/vietnamese-receipts-mc-ocr-2021"
    output_dir: "/kaggle/working/outputs"
  local:
    dataset_dir: "data/raw/mc-ocr-2021"
    output_dir: "outputs"

# Team decision (Nov 2026): the extraction model (fine-tuned LayoutXLM) is SUPERVISED.
# Entity labels train it on the train split only; hyper-parameters are chosen on validation;
# the test split is scored once at the end. Inference never reads annotations.
data_policy:
  use_receipt_entity_labels_for_training: true
  annotations_allowed_for: ["dataset_audit", "training_on_train_split", "model_selection_on_validation", "final_evaluation_on_test"]
  inference_reads_annotations: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
