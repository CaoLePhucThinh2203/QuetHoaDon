name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies (no GPU / model packages needed)
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
